name: Web app (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble installable web app
        run: |
          mkdir -p _site
          cp web/* _site/
          python3 - <<'PY'
          import os
          s=open('www/index.html',encoding='utf-8').read()
          head='''<link rel="manifest" href="manifest.webmanifest">
          <link rel="apple-touch-icon" href="icon-180.png">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-title" content="Naz &amp; Pash">
          <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
          <meta name="theme-color" content="#ffd1e3">
          <script>if('serviceWorker' in navigator&&location.protocol==='https:'){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
          '''
          s=s.replace('</title>','</title>\n'+head,1)
          open('_site/index.html','w',encoding='utf-8').write(s)
          w=open('_site/sw.js').read().replace('__BUILD__',os.environ['GITHUB_RUN_NUMBER'])
          open('_site/sw.js','w').write(w)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4

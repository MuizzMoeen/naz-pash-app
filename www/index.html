*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;font-family:Fredoka,system-ui,sans-serif;background:linear-gradient(160deg,#ffe4ef,#efe4ff 60%,#e2f1ff);color:#5a3d55;min-height:100vh}
#app{max-width:1040px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left))}
button{touch-action:manipulation}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
header h1{font-size:22px;margin:0;flex:1;color:#d0457f;letter-spacing:.3px}
.pill{background:#fff;border-radius:999px;padding:6px 14px;font-weight:600;box-shadow:0 2px 0 #f3c6d8;font-size:15px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.pill.bump{animation:bump .45s ease}
@keyframes bump{40%{transform:scale(1.18)}}
.fb{display:inline-block;width:60px;height:9px;background:#f4e3ec;border-radius:9px;overflow:hidden}
.fb i{display:block;height:100%;background:linear-gradient(90deg,#ffb3d1,#ff6fae);border-radius:9px;transition:width .4s}
.hbtn{border:none;background:#fff;border-radius:999px;width:36px;height:36px;font-size:18px;cursor:pointer;box-shadow:0 2px 0 #f3c6d8;font-family:inherit}
#cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.card{background:#fff;border-radius:20px;padding:10px 12px;border:3px solid transparent;cursor:pointer;box-shadow:0 3px 0 rgba(208,69,127,.12);transition:border-color .2s,transform .2s,box-shadow .2s;position:relative;overflow:hidden}
.card.naz{background:radial-gradient(circle at 0 0,#ffe3ef 0,#fff 55%) ,#fff}
.card.pash{background:radial-gradient(circle at 0 0,#ffe9d2 0,#fff 55%),#fff}
.card.sel{box-shadow:0 6px 18px rgba(208,69,127,.18)}
.ctop{display:flex;gap:10px;align-items:center}
.card .av{width:60px;height:63px;flex:none;border-radius:50%;background:#fff;box-shadow:0 0 0 3px var(--cc),0 3px 8px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .av svg{width:54px;height:57px;margin-top:8px}
.cmid{min-width:0;flex:none;max-width:44%}
.mood{display:block;font-size:12px;font-weight:600;color:#9a6a8a;margin-top:1px}
.think{flex:1;position:relative;background:#fff;border-radius:16px;padding:7px 11px;font-size:13.5px;font-weight:500;color:#6d4a66;box-shadow:0 2px 8px rgba(160,70,120,.12);line-height:1.3;min-height:34px;display:flex;align-items:center}
.think:before{content:"";position:absolute;left:-7px;top:50%;margin-top:-6px;border:6px solid transparent;border-left:0;border-right-color:#fff}
.think.urgent{background:#fff2f5;color:#c23a5e}
.think.urgent:before{border-right-color:#fff2f5}
.think.pop{animation:thpop .35s ease}

function openVet(k,reason){const c=S.cats[k],n=CATS[k],illT=c.ill&&c.ill.t,guess=reason&&reason!=='check'?reason:null;
 openOverlay(`<div class="panel mg">${mgHead('🩺 Vet checkup — '+n.name,vetDue(k)?'Time for the routine checkup!':'Not due yet, but a checkup never hurts!')}<div class="mgArea bg-vet" id="mgA">

 const A=$('#mgA'),C=$('#mgC'),svg=C.querySelector('svg');A.style.cursor='default';
 const steps=[
  {t:'⚖️ Weigh',d:`Tap the scale button to weigh ${n.name}.`,type:'btn',res:'Healthy weight ✔'},
  {t:'👂 Ears',d:'Tap both ears to check inside.',spots:n.ears,res:c.clean<40?'Ears a bit dirty — bath soon!':'Ears are clean ✔'},
  {t:'👀 Eyes',d:'Tap each eye.',spots:n.eyes,res:k==='naz'?'A little teary (normal for Persians) — wipe her eyes gently ✔':'Bright and clear ✔'},
  {t:'🦷 Teeth',d:'Tap the mouth to peek at the teeth.',spots:[n.mouth],res:'Pearly white ✔'},
  {t:'🩺 Heart',d:'Tap the stethoscope on the chest 4 times to listen to the heartbeat.',type:'hold',spot:[100,150],res:'Strong, happy heartbeat ✔'}];
 if(illT)steps.push({t:'💊 Medicine',d:'Tap the pill to give the medicine (cats HATE pills…)',type:'pill',res:`Diagnosis: ${ILL[illT].e} ${ILL[illT].n} — medicine given 💊`});
 let si=0;const res=[];
 const list=()=>{$('#vs').innerHTML=steps.map((s,i)=>`<li class="${i<si?'ok':i===si?'cur':''}">${i<si?'✅':''} ${s.t}</li>`).join('')};
 const next=r=>{res.push(r);$('#docT').textContent=r;si++;bar(si/steps.length);list();tone(880,1200,.1,.06);setTimeout(run,900)};
 function run(){A.querySelectorAll('.hot').forEach(h=>h.remove());$('#mgAct').innerHTML='';if(si>=steps.length)return end();const s=steps[si];$('#mgSub').textContent=s.d;
  if(s.type==='btn'){$('#mgAct').innerHTML='<button class="btn alt">⚖️ Weigh</button>';$('#mgAct button').onclick=()=>{$('#mgAct').innerHTML='';svg.classList.add('poof');SFX.meow(k,'short',.6);setTimeout(()=>svg.classList.remove('poof'),700);next(s.res)};return}
  if(s.type==='pill'){let tries=0;const mk2=()=>{const h=el('div','hot',null,C);h.textContent='💊';h.style.cssText+=`;display:flex;align-items:center;justify-content:center;font-size:24px;left:${(n.mouth[0]+rand(-25,25))*SC}px;top:${(n.mouth[1]+rand(-5,30))*SC}px`;
    h.onpointerdown=()=>{h.remove();if(tries++===0){SFX.meow(k,'grr',.8);svg.classList.add('grumpy');$('#docT').textContent='PTOO! 😾 She spat it out — try again!'.replace('She',n.pron==='he'?'He':'She');fx('💨',C.offsetLeft+n.mouth[0]*SC,C.offsetTop+n.mouth[1]*SC,A);setTimeout(mk2,500)}else{SFX.blip();fx('😋',C.offsetLeft+n.mouth[0]*SC,C.offsetTop+n.mouth[1]*SC,A);next(s.res)}}};mk2();return}
  if(s.type==='hold'){const h=el('div','hot hold',null,C);h.style.left=s.spot[0]*SC+'px';h.style.top=s.spot[1]*SC+'px';let n=0;h.style.setProperty('--p','0%');
   h.onpointerdown=e=>{e.stopPropagation();n++;h.style.setProperty('--p',(n*25)+'%');fx('💗',C.offsetLeft+s.spot[0]*SC,C.offsetTop+s.spot[1]*SC-30,A);SFX.thump();$('#docT').textContent=['ba-dum…','ba-dum… ba-dum…','ba-dum… ba-dum… ba-dum…','💗 ba-dum!'][n-1];if(n>=4){h.onpointerdown=null;setTimeout(()=>next(s.res),350)}};return}
  let left=s.spots.length;s.spots.forEach(([x,y])=>{const h=el('div','hot',null,C);h.style.left=x*SC+'px';h.style.top=y*SC+'px';h.onpointerdown=()=>{h.remove();SFX.blip();fx('✔️',C.offsetLeft+x*SC,C.offsetTop+y*SC,A,22);if(--left===0)next(s.res)}})}
 function end(){const tips=[];if(c.clean<50)tips.push('🛁 A bath would be nice soon');if(c.fur<50)tips.push(k==='naz'?'✨ Persians need brushing almost every day':'✨ A good brushing would help');if(c.nails>65)tips.push('✂️ Nails are getting long');if(c.food<40)tips.push('🍽️ Keep the food bowl topped up');if(c.water<40)tips.push('💧 More fresh water please');if(S.lumps.length>=4)tips.push('🧹 Keep the litter box clean');
  let extra=[];if(illT){if(!c.hist)c.hist=[];c.hist.push({d:S.day,t:illT});c.ill=null;extra.push(guess===illT?'🌟 Great observation — you spotted the symptoms! (+10 💗)':guess?`🔎 It wasn’t “${ILL[guess].sym.toLowerCase()}” — but the vet found the real problem!`:'🔎 Good thing you came in — the vet found a problem!');if(guess===illT){addLove(10);stat('diag')}extra.push(`${n.name} will feel better soon 💕`)}
  else if(guess)extra.push('🍀 Nothing wrong at all — maybe just a mood. Better safe than sorry!');

  finish(illT?`${n.name} is getting better! 💊`:`${n.name} is healthy! 🎉`,extra.concat(res).concat(tips.length?tips:['🌟 Perfectly healthy and very loved']).concat(['Next checkup in 2 months (60 days) 📅']))}
